# MFAMambaIRv2: 三创新点集成 (MFA + TSSM + DSTA) — Classical SR x2
# 8卡 RTX 2080 分布式训练
name: MFAMambaIRv2_SR_x2
model_type: MambaIRv2Model
scale: 2
num_gpu: 8
manual_seed: 10

datasets:
  train:
    task: SR
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt:
      - /home/guoshuaile/pyproject/data/DIV2K/DIV2K_train_HR
    dataroot_lq:
      - /home/guoshuaile/pyproject/data/DIV2K/DIV2K_train_LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 6  # 2080Ti(11G): 4090(24G,bs=16)×11/24≈7.3, 扣固定开销→6
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /home/guoshuaile/pyproject/data/SR/Set14/HR
    dataroot_lq: /home/guoshuaile/pyproject/data/SR/Set14/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

network_g:
  type: MFAMambaIRv2
  upscale: 2
  in_chans: 3
  img_size: 64
  img_range: 1.
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  # ---- 三创新点 ----
  use_freq: true
  use_tssm: true
  use_dsta: true
  # ---- MFA 参数 ----
  num_freq_scales: 3
  freq_deploy_ratio: 0.75
  cfsg_kernels: [7, 9, 11]
  # ---- DSTA 参数 ----
  dsta_keep_ratio: 0.5
  dsta_group_size: 4

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5
  total_iter: 500000
  warmup_iter: 5000
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  swanlab:
    project: MFAMambaIRv2
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
